server {
    listen 80;
    server_name api.chanfolio.my.id;

    # ── Backend API ──────────────────────────────────────────
    location / {
        # ── API Key Validation ───────────────────────────────
        # Allow OPTIONS requests to pass through for CORS preflight
        set $api_auth 0;
        if ($request_method = OPTIONS) {
            set $api_auth 1;
        }
        if ($http_x_api_key = "f663f96eb5bacad610d978e1e62de8a96fd2f186b638e87376dbb4826154f65a") {
            set $api_auth 1;
        }
        if ($api_auth = 0) {
            return 401 '{"status": "error", "message": "Unauthorized: Invalid API Key"}';
        }
        default_type application/json;

        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow larger uploads (face images, etc.)
        client_max_body_size 50M;

        # Generous timeout for ML inference requests
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;
        proxy_connect_timeout 60s;
    }

    # ── Health / status endpoint ─────────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:5000/health;
        access_log off;
    }
}

