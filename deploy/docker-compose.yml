version: "3.8"

# =============================================================
#  Backend Stack — Face Recognition Attendance System
#  Includes: postgres, redis, minio, minio-init, backend
#
#  The ml-service lives in ml-service/deploy/ and communicates
#  with this stack via the shared external network "app_network".
#
#  Usage (from this directory):
#    docker compose up -d [--build]
# =============================================================

services:

  # ── Infrastructure ────────────────────────────────────────────

  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # SQL dump is loaded automatically on FIRST startup (when volume is empty)
      - ./init-db:/docker-entrypoint-initdb.d:ro
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      # Console UI — access at http://YOUR_VPS_IP:9001 (optional)
      - "127.0.0.1:9001:9001"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5

  minio-init:
    # Runs once to create the bucket then exits
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY} &&
        mc mb --ignore-existing local/$${MINIO_BUCKET} &&
        echo 'MinIO bucket ready.'
      "
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Application ───────────────────────────────────────────────

  backend:
    build:
      # Build context is the repo root (one level up from this deploy/ folder)
      context: ..
      dockerfile: Dockerfile.backend
    restart: always
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      # config.yaml lives alongside this docker-compose.yml in deploy/
      - ./config.yaml:/app/config.yaml
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env

# ── Persistent Volumes ──────────────────────────────────────────
volumes:
  postgres_data:
  minio_data:
  redis_data:

# ── Networks ────────────────────────────────────────────────────
networks:
  # Shared with ml-service stack.
  # Create once on VPS before first deploy:
  #   docker network create app_network
  app_network:
    external: true
